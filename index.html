<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosmic Acquisitions</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <nav class="skip-links" aria-label="Skip to section">
      <a href="#star-map">Star Map</a>
      <a href="#your-ship">Your Ship</a>
      <a href="#market">Market</a>
      <a href="#event-log">Event Log</a>
    </nav>

    <header>
      <h1>Cosmic Acquisitions</h1>
      <p id="turn-status" aria-live="polite">Setting up a new game&hellip;</p>
    </header>

    <!--
      Generic notice banner — currently used to explain why Escape/backdrop
      click didn't dismiss a mandatory dialog (founding/merger-survivor/
      share-disposition), per docs/ui-design.md's "Dialogs" section: those
      decisions have no valid way to be abandoned once the phase is entered.
    -->
    <p id="notice-message" role="alert" hidden></p>

    <section id="game-over" aria-labelledby="game-over-heading" hidden>
      <h2 id="game-over-heading">Game Over</h2>
      <ol id="final-standings-list"></ol>
    </section>

    <main>
      <section id="star-map" aria-labelledby="star-map-heading">
        <h2 id="star-map-heading">Star Map</h2>
        <table id="star-map-table">
          <caption>Star Map</caption>
        </table>
      </section>

      <section id="your-ship" aria-labelledby="your-ship-heading">
        <h2 id="your-ship-heading">Your Ship</h2>
        <p class="credits-display">
          Credits: <span id="credits-display">0</span>
        </p>
        <h3>Hand</h3>
        <ul id="hand-list" class="hand-list"></ul>
        <h3>Your Shares</h3>
        <ul id="shares-list" class="shares-list"></ul>
        <button id="end-turn-button" type="button" hidden>End Turn</button>
        <button id="end-game-button" type="button" hidden>End Game</button>
      </section>

      <section id="market" aria-labelledby="market-heading">
        <h2 id="market-heading">Market</h2>
        <p id="share-purchase-status" aria-live="polite"></p>
        <table id="market-table">
          <thead>
            <tr>
              <th scope="col">Corporation</th>
              <th scope="col">Tier</th>
              <th scope="col">Sectors</th>
              <th scope="col">Secure</th>
              <th scope="col">Price</th>
              <th scope="col">Shares left</th>
              <th scope="col">Buy</th>
            </tr>
          </thead>
          <tbody id="market-table-body"></tbody>
        </table>
      </section>

      <section id="event-log" aria-labelledby="event-log-heading">
        <h2 id="event-log-heading">Event Log</h2>
        <ul id="event-log-list" aria-live="polite"></ul>
      </section>
    </main>

    <dialog id="placement-dialog">
      <p id="placement-dialog-message"></p>
      <div class="dialog-actions">
        <button id="placement-dialog-cancel" type="button">Cancel</button>
        <button id="placement-dialog-confirm" type="button">Confirm</button>
      </div>
    </dialog>

    <!--
      Mandatory dialogs (docs/ui-design.md): each is populated by
      js/ui/render.js right before being shown, and intercepts Escape /
      backdrop-click via js/ui/main.js's makeMandatory() helper, since none
      of these three decisions has a valid way to be abandoned mid-turn.
    -->
    <dialog id="founding-dialog">
      <p id="founding-dialog-message"></p>
      <ul id="founding-choice-list" class="dialog-choice-list"></ul>
    </dialog>

    <dialog id="merger-survivor-dialog">
      <p id="merger-survivor-message"></p>
      <ul id="merger-survivor-choice-list" class="dialog-choice-list"></ul>
    </dialog>

    <dialog id="share-disposition-dialog">
      <p id="share-disposition-message"></p>
      <div class="disposition-inputs">
        <label>Sell <input type="number" id="disposition-sell" min="0" value="0"></label>
        <label>Trade <input type="number" id="disposition-trade" min="0" value="0"></label>
        <label>Hold <input type="number" id="disposition-hold" min="0" value="0"></label>
      </div>
      <p id="share-disposition-validation" aria-live="polite"></p>
      <div class="dialog-actions">
        <button id="share-disposition-confirm" type="button">Confirm</button>
      </div>
    </dialog>

    <script type="module" src="js/ui/main.js"></script>
  </body>
</html>
