name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run lint:css
      - run: npm run lint:html

      # Only chromium is configured as a Playwright project (see
      # playwright.config.js), so no need to install every browser engine.
      - run: npx playwright install --with-deps chromium

      - run: npm test
